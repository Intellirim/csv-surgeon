[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-surgeon"
version = "1.1.0"
description = "Intelligent CSV repair and sanitization for broken data files"
readme = "README.md"
authors = [{name = "Intellirim"}]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
keywords = ["csv", "data-cleaning", "cli-tool", "data-engineering", "etl", "data-quality"]
dependencies = [
    "click>=8.1.0",
    "chardet>=5.0.0",
]

[project.scripts]
csv-surgeon = "csv_surgeon.cli:main"

[project.urls]
Homepage = "https://github.com/intellirim/csv-surgeon"
Repository = "https://github.com/intellirim/csv-surgeon"

[tool.setuptools.packages.find]
include = ["csv_surgeon*"]
